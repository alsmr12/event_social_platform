{{define "subscriptions_content"}}
<div class="card">
    <div id="subscriptions-content">
        <div class="loading">Загрузка подписок...</div>
    </div>
    <script>
        window.currentUser = {{if .CurrentUser}}{
            id: {{.CurrentUser.ID}},
            email: "{{.CurrentUser.Email}}",
                firstName: "{{.CurrentUser.FirstName}}",
                lastName: "{{.CurrentUser.LastName}}",
                gender: "{{.CurrentUser.Gender}}"
        }{{else}}null{{end}};
    </script>
    <script src="/static/js/subscriptions.js"></script>
</div>
{{end}}
