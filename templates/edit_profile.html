{{define "edit_profile_content"}}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div id="edit-profile-content">
        <div class="loading">Загрузка формы редактирования...</div>
    </div>
</div>

<script>
    // Передаем данные текущего пользователя в JavaScript
    window.currentUser = {{if .CurrentUser}}{
        id: {{.CurrentUser.ID}},
        email: "{{.CurrentUser.Email}}",
            firstName: "{{.CurrentUser.FirstName}}",
            lastName: "{{.CurrentUser.LastName}}",
            gender: "{{.CurrentUser.Gender}}",
            birthDate: "{{.CurrentUser.BirthDate}}",
            phone: "{{.CurrentUser.Phone}}"
    }{{else}}null{{end}};

    // Передаем социальные сети если есть
    window.socialLinks = {{if .SocialLinks}}[
        {{range .SocialLinks}}
    {
        platform: "{{.Platform}}",
            username: "{{.Username}}",
        custom_name: "{{.CustomName}}"
    },
    {{end}}
    ]{{else}}[]{{end}};
</script>
<script src="/static/js/edit_profile.js"></script>
{{end}}
