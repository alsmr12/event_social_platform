{{define "edit_profile_content"}}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 style="text-align: center; margin-bottom: 30px;">Редактирование профиля</h2>

    {{if .Error}}
    <div class="alert alert-error">
        {{.Error}}
    </div>
    {{end}}

    <form action="/edit-profile" method="POST">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" value="{{.User.Email}}" class="form-control" readonly style="background: var(--light-bg);">
            <small style="color: var(--text-muted);">Email нельзя изменить</small>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="first_name">Имя *</label>
                <input type="text" id="first_name" name="first_name" value="{{.User.FirstName}}" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="last_name">Фамилия *</label>
                <input type="text" id="last_name" name="last_name" value="{{.User.LastName}}" class="form-control" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="gender">Пол</label>
                <select id="gender" name="gender" class="form-control">
                    <option value="">Не указано</option>
                    <option value="male" {{if eq .User.Gender "male"}}selected{{end}}>Мужской</option>
                    <option value="female" {{if eq .User.Gender "female"}}selected{{end}}>Женский</option>
                </select>
            </div>
            <div class="form-group">
                <label for="age">Возраст</label>
                <input type="number" id="age" name="age" value="{{.User.Age}}" class="form-control" min="1" max="120">
            </div>
        </div>

        <div class="form-group">
            <label for="phone">Телефон</label>
            <input type="tel" id="phone" name="phone" value="{{.User.Phone}}" class="form-control" placeholder="+7 (XXX) XXX-XX-XX">
        </div>

        <div class="form-group">
            <label for="social_links">Социальные сети</label>
            <textarea id="social_links" name="social_links" class="form-control" placeholder="Ссылки на ваши социальные сети...">{{.User.SocialLinks}}</textarea>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-color);">
            <a href="/profile" class="btn btn-secondary">Отмена</a>
            <button type="submit" class="btn btn-primary">Сохранить изменения</button>
        </div>
    </form>
</div>
{{end}}
