{{define "event_subscriptions_content"}}
<div class="card">
    <div id="event-subscriptions-content">
        <div class="loading">Загрузка подписок...</div>
    </div>
    <script>
        window.currentUser = {{if .CurrentUser}}{
            id: {{.CurrentUser.ID}},
            email: "{{.CurrentUser.Email}}",
                firstName: "{{.CurrentUser.FirstName}}",
                lastName: "{{.CurrentUser.LastName}}",
                gender: "{{.CurrentUser.Gender}}",
                latitude: {{.CurrentUser.Latitude}},
            longitude: {{.CurrentUser.Longitude}}
        }{{else}}null{{end}};
    </script>
    <script src="/static/js/event-subscriptions.js"></script>
</div>
{{end}}
