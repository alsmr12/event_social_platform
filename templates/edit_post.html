{{define "edit_post_content"}}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 style="text-align: center; margin-bottom: 30px;">Редактирование записи</h2>

    {{if .Error}}
    <div class="alert alert-error">
        {{.Error}}
    </div>
    {{end}}

    <form action="/wall/edit/{{.Post.ID}}" method="POST">
        <div class="form-group">
            <label for="content">Текст записи *</label>
            <textarea id="content" name="content" class="form-control" required maxlength="1000">{{.Post.Content}}</textarea>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 30px;">
            <a href="javascript:history.back()" class="btn btn-secondary">Отмена</a>
            <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
    </form>
</div>
{{end}}
