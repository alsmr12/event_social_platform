{{define "profiles_content"}}
<div class="card">
    <div id="profiles-content">
        <div class="loading">Загрузка пользователей...</div>
    </div>
    <script>
        // Передаем данные текущего пользователя в JavaScript
        window.currentUser = {{if .CurrentUser}}{
            id: {{.CurrentUser.ID}},
            email: "{{.CurrentUser.Email}}",
            firstName: "{{.CurrentUser.FirstName}}",
            lastName: "{{.CurrentUser.LastName}}",
            gender: "{{.CurrentUser.Gender}}"
        }{{else}}null{{end}};
    </script>
    <script src="/static/js/profiles.js"></script>
</div>
{{end}}
