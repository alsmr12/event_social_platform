{{define "home_content"}}
<div style="text-align: center; padding: 100px 20px;">
  <h1 style="font-size: 2.8em; margin-bottom: 20px; color: var(--text-primary);">
    SocialSphere
  </h1>
  <p style="font-size: 1.3em; color: var(--text-muted); margin-bottom: 50px;">
    Войти или зарегистрироваться
  </p>

  {{if .CurrentUser}}
  <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 60px;">
    <a href="/events" class="btn btn-primary">События</a>
    <a href="/profiles" class="btn btn-outline">Люди</a>
    <a href="/profile" class="btn btn-outline">Профиль</a>
  </div>
  {{else}}
  <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 60px;">
    <a href="/login" class="btn btn-primary">Войти</a>
    <a href="/create-profile" class="btn btn-outline">Регистрация</a>
  </div>
  {{end}}
</div>
{{end}}
