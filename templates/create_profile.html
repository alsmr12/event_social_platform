{{define "register_content"}}
<div class="card" style="max-width: 600px; margin: 30px auto;">
    <h2 style="text-align: center; margin-bottom: 30px;">Создание профиля</h2>

    {{if .Error}}
    <div class="alert alert-error">
        {{.Error}}
    </div>
    {{end}}

    <form action="/create-profile" method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="first_name">Имя *</label>
                <input type="text" id="first_name" name="first_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="last_name">Фамилия *</label>
                <input type="text" id="last_name" name="last_name" class="form-control" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль *</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="gender">Пол</label>
                <select id="gender" name="gender" class="form-control">
                    <option value="">Не указано</option>
                    <option value="male">Мужской</option>
                    <option value="female">Женский</option>
                </select>
            </div>
            <div class="form-group">
                <label for="age">Возраст</label>
                <input type="number" id="age" name="age" class="form-control" min="1" max="120">
            </div>
        </div>

        <div class="form-group">
            <label for="phone">Телефон</label>
            <input type="tel" id="phone" name="phone" class="form-control" placeholder="+7 (XXX) XXX-XX-XX">
        </div>

        <div class="form-group">
            <label for="social_links">Социальные сети</label>
            <textarea id="social_links" name="social_links" class="form-control" placeholder="Ссылки на ваши социальные сети..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Создать профиль</button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <p>Уже есть аккаунт? <a href="/login">Войти</a></p>
    </div>
</div>
{{end}}
