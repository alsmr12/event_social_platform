{{define "register_content"}}
<div class="card" style="max-width: 600px; margin: 30px auto;">
    <h2 style="text-align: center; margin-bottom: 30px;">Создание профиля</h2>

    {{if .Error}}
    <div class="alert alert-error">
        {{.Error}}
    </div>
    {{end}}

    <form action="/create-profile" method="POST" id="registrationForm">
        <div class="form-row">
            <div class="form-group">
                <label for="first_name">Имя *</label>
                <input type="text" id="first_name" name="first_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="last_name">Фамилия *</label>
                <input type="text" id="last_name" name="last_name" class="form-control" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль *</label>
            <input type="password" id="password" name="password" class="form-control" required minlength="6">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="gender">Пол</label>
                <select id="gender" name="gender" class="form-control">
                    <option value="">Не указано</option>
                    <option value="male">Мужской</option>
                    <option value="female">Женский</option>
                </select>
            </div>
            <div class="form-group">
                <label for="birth_date">Дата рождения</label>
                <input type="date" id="birth_date" name="birth_date" class="form-control">
                <small style="color: var(--text-muted);">Выберите дату рождения</small>
            </div>
        </div>

        <div class="form-group">
            <label for="phone">Телефон</label>
            <input type="tel" id="phone" name="phone" class="form-control" 
                   placeholder="+7 (900) 123-45-67"
                   pattern="\+7\s?[\(]?\d{3}[\)]?\s?\d{3}[\-]?\d{2}[\-]?\d{2}"
                   title="Формат: +7 (XXX) XXX-XX-XX">
            <small style="color: var(--text-muted);">Формат: +7 (XXX) XXX-XX-XX</small>
        </div>

        <div class="form-group">
            <label for="social_links">Социальные сети</label>
            <textarea id="social_links" name="social_links" class="form-control" 
                      placeholder="Ссылки на ваши социальные сети... (например: https://vk.com/username, https://t.me/username)"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Создать профиль</button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <p>Уже есть аккаунт? <a href="/login">Войти</a></p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const phoneInput = document.getElementById('phone');
    const form = document.getElementById('registrationForm');
    const birthDateInput = document.getElementById('birth_date');

    // Установка максимальной даты (сегодня)
    const today = new Date().toISOString().split('T')[0];
    birthDateInput.setAttribute('max', today);
    birthDateInput.setAttribute('min', '1900-01-01');

    // Маска для телефона
    phoneInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        
        if (value.startsWith('7') || value.startsWith('8')) {
            value = '7' + value.substring(1);
        } else if (value.startsWith('9') && value.length === 10) {
            value = '7' + value;
        }
        
        if (value.length > 0) {
            value = '+7' + value.substring(1);
        }
        
        if (value.length > 2) {
            value = value.substring(0, 2) + ' (' + value.substring(2);
        }
        if (value.length > 7) {
            value = value.substring(0, 7) + ') ' + value.substring(7);
        }
        if (value.length > 12) {
            value = value.substring(0, 12) + '-' + value.substring(12);
        }
        if (value.length > 15) {
            value = value.substring(0, 15) + '-' + value.substring(15);
        }
        
        e.target.value = value.substring(0, 18);
    });

    // Валидация формы
    form.addEventListener('submit', function(e) {
        const phone = phoneInput.value;
        
        // Проверка телефона (если заполнен)
        if (phone && !/^\+7\s?\(\d{3}\)\s?\d{3}-\d{2}-\d{2}$/.test(phone)) {
            e.preventDefault();
            alert('Пожалуйста, введите корректный номер телефона в формате: +7 (XXX) XXX-XX-XX');
            phoneInput.focus();
            return false;
        }

        // Проверка даты рождения (если заполнена)
        if (birthDateInput.value) {
            const birthDate = new Date(birthDateInput.value);
            const today = new Date();
            
            if (birthDate > today) {
                e.preventDefault();
                alert('Дата рождения не может быть в будущем');
                birthDateInput.focus();
                return false;
            }
        }
    });

    // Подсказка при фокусе на телефоне
    phoneInput.addEventListener('focus', function() {
        if (!this.value) {
            this.value = '+7 (';
        }
    });

    // Автозаполнение скобок
    phoneInput.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && this.value === '+7 (') {
            this.value = '';
        }
    });
});
</script>

<style>
/* Стили для календаря */
input[type="date"] {
    position: relative;
}

input[type="date"]::-webkit-calendar-picker-indicator {
    background: transparent;
    bottom: 0;
    color: transparent;
    cursor: pointer;
    height: auto;
    left: 0;
    position: absolute;
    right: 0;
    top: 0;
    width: auto;
}

/* Подсветка невалидных полей */
input:invalid {
    border-color: var(--danger-color);
}

input:valid {
    border-color: var(--success-color);
}
</style>
{{end}}
