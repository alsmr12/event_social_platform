{{define "news_content"}}
<div class="card">
    <div style="display: flex; justify-content: between; align-items: center; margin-bottom: 30px; gap: 10px;">
        <h2>Лента новостей</h2>
        <button id="refreshNews" class="btn btn-outline btn-small" style="display: none;">
            Обновить
        </button>
    </div>

    <div id="newsContent">
        <!-- Контент будет загружен через JavaScript -->
        <div class="empty-state">
            <p>Загрузка новостей...</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const newsContent = document.getElementById('newsContent');
        const refreshBtn = document.getElementById('refreshNews');

        // Функция для загрузки новостей
        async function loadNewsFeed() {
            try {
                newsContent.innerHTML = `
                <div class="empty-state">
                    <p>Загрузка новостей...</p>
                </div>
            `;

                const response = await fetch('/api/news', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include'
                });

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message || 'Ошибка загрузки новостей');
                }

                renderNewsContent(result.posts, result.events);

                // Показываем кнопку обновления после успешной загрузки
                refreshBtn.style.display = 'block';

            } catch (error) {
                console.error('Ошибка загрузки новостей:', error);
                newsContent.innerHTML = `
                <div class="empty-state">
                    <h3>Ошибка загрузки</h3>
                    <p>${error.message}</p>
                    <button onclick="loadNewsFeed()" class="btn btn-primary">Попробовать снова</button>
                </div>
            `;
            }
        }

        // Функция для отображения контента
        function renderNewsContent(posts, events) {
            if ((!posts || posts.length === 0) && (!events || events.length === 0)) {
                newsContent.innerHTML = `
                <div class="empty-state">
                    <h3>Лента новостей пуста</h3>
                    <p style="margin-bottom: 20px;">Начните добавлять друзей и подписываться на людей, чтобы видеть их обновления здесь.</p>
                    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                        <a href="/profiles" class="btn btn-primary">Найти людей</a>
                        <a href="/events" class="btn btn-outline">Посмотреть события</a>
                    </div>
                </div>
            `;
                return;
            }

            let html = `
            <div class="grid grid-2">
                <!-- Левая колонка - посты -->
                <div>
                    <h3 style="margin-bottom: 20px;">Последние записи</h3>
        `;

            // Отображаем посты
            if (posts && posts.length > 0) {
                html += `<div class="posts">`;
                posts.forEach(post => {
                    const postDate = new Date(post.created_at).toLocaleString('ru-RU', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    // Проверяем существование post.user перед доступом к его свойствам
                    const userName = post.user ? `${post.user.first_name} ${post.user.last_name}` : 'Неизвестный пользователь';
                    const userId = post.user ? post.user.id : null;

                    html += `
                    <div class="post">
                        <div class="post-header">
                            <div>
                                <div style="display: flex; gap: 5px; font-size: 0.9em; color: var(--text-muted);">
                                    <span>Автор:</span>
                                    <a href="/profile/${post.author.id}" style="text-decoration: none; color: var(--text-primary);">
                                        ${post.author.first_name} ${post.author.last_name}
                                    </a>
                                </div>
                                <div style="display: flex; gap: 5px; font-size: 0.9em; color: var(--text-muted);">
                                    <span>На стене:</span>
                                    ${post.user ? `
                                        <a href="/profile/${post.user.id}" style="text-decoration: none; color: var(--text-primary);">
                                            ${post.user.first_name} ${post.user.last_name}
                                        </a>
                                    ` : `<span>Неизвестный пользователь</span>`}
                                </div>
                            </div>
                            <span class="post-date">${postDate}</span>
                        </div>
                        <div class="post-content">${escapeHtml(post.content)}</div>
                        <div class="post-actions">
                            ${isCurrentUserPost(post.author.id) ? `
                                <a href="/wall/edit/${post.id}" class="btn btn-outline btn-small">Редактировать</a>
                                <a href="/wall/delete/${post.id}" class="btn btn-danger btn-small" onclick="return confirm('Удалить запись?')">Удалить</a>
                            ` : ''}
                        </div>
                    </div>
                `;
                });
                html += `</div>`;
            } else {
                html += `
                <div class="empty-state">
                    <p>Пока нет записей от ваших друзей и подписок.</p>
                </div>
            `;
            }

            html += `
                </div>

                <!-- Правая колонка - события -->
                <div>
                    <h3 style="margin-bottom: 20px;">Новые события</h3>
        `;

            // Отображаем события
            if (events && events.length > 0) {
                html += `<div class="events-feed">`;
                events.forEach(event => {
                    const eventDate = new Date(event.event.date_time).toLocaleString('ru-RU', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    const eventType = getEventTypeText(event.event.type);

                    html += `
                    <div class="card" style="margin-bottom: 16px; padding: 16px;">
                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                            <h4 style="margin: 0; font-size: 1.1em;">${escapeHtml(event.event.title)}</h4>
                            <span class="badge" style="background: #007bff; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75em;">
                                ${eventType}
                            </span>
                        </div>

                        <p style="color: var(--text-muted); font-size: 0.9em; margin-bottom: 12px;">${escapeHtml(event.event.description)}</p>

                        <div style="font-size: 0.85em; line-height: 1.6; margin-bottom: 12px;">
                            <div><strong>📅</strong> ${eventDate}</div>
                            <div><strong>📍</strong> ${escapeHtml(event.event.location)}</div>
                            <div><strong>👤</strong>
                                <a href="/profile/${event.author.id}" style="text-decoration: none; color: var(--text-primary);">
                                    ${event.author.first_name} ${event.author.last_name}
                                </a>
                            </div>
                        </div>

                        <div style="display: flex; gap: 8px;">
                            <a href="/event/${event.id}" class="btn btn-outline btn-small">Подробнее</a>
                            ${isCurrentUserEvent(event.author.id) ? `
                                <a href="/event/edit/${event.id}" class="btn btn-outline btn-small">Редактировать</a>
                            ` : ''}
                        </div>
                    </div>
                `;
                });
                html += `</div>`;
            } else {
                html += `
                <div class="empty-state">
                    <p>Пока нет событий от ваших друзей и подписок.</p>
                </div>
            `;
            }

            html += `
                </div>
            </div>
        `;

            newsContent.innerHTML = html;
        }

        // Вспомогательные функции
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getEventTypeText(type) {
            const typeMap = {
                'concert': 'Концерт',
                'lecture': 'Лекция',
                'sport': 'Спорт',
                'meetup': 'Встреча',
                'party': 'Вечеринка',
                'conference': 'Конференция',
                'exhibition': 'Выставка',
                'other': 'Другое'
            };
            return typeMap[type] || type;
        }

        function isCurrentUserPost(authorId) {
            // Эта функция должна проверять, является ли текущий пользователь автором поста
            // В реальном приложении нужно получить ID текущего пользователя
            // Пока возвращаем false для безопасности
            return false;
        }

        function isCurrentUserEvent(creatorId) {
            // Аналогично для событий
            return false;
        }

        // Обработчик кнопки обновления
        refreshBtn.addEventListener('click', loadNewsFeed);

        // Загружаем новости при загрузке страницы
        loadNewsFeed();

        // Автоматическое обновление каждые 2 минуты
        setInterval(loadNewsFeed, 120000);
    });
</script>
{{end}}
